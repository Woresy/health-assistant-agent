name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Resolve health knowledge query encoder pin
        id: embedding
        run: >-
          python scripts/prepare_health_knowledge_model.py
          --emit-pin >> "$GITHUB_OUTPUT"

      - name: Cache health knowledge query encoder
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ steps.embedding.outputs.cache_key }}

      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Prepare health knowledge query encoder
        run: python scripts/prepare_health_knowledge_model.py

      - name: Install browser test dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Static syntax check
        run: python -m compileall -q app.py src scripts tests

      - name: Validate Tencent Lighthouse deployment manifest
        run: >-
          docker compose
          --env-file deploy/tencent/production.env.example
          -f deploy/tencent/compose.yaml
          config --quiet

      - name: Build Tencent Lighthouse deployment image
        run: docker build --tag healthos-agent:ci .

      - name: Unit, evaluation and end-to-end tests
        env:
          AGENT_PROVIDER_MODE: disabled
          RAG_MODE: lexical
          LANGSMITH_TRACING: "false"
        run: python -m pytest -q

      - name: Browser end-to-end tests
        env:
          HEALTHOS_PYTHON: python
        run: npm run test:browser

      - name: Verify local performance contract
        run: >-
          python scripts/benchmark_performance.py
          --assert-thresholds
          --report /tmp/healthos-performance.json

      - name: Verify GitHub delivery hygiene
        run: >-
          python scripts/check_release.py
          --report /tmp/healthos-release-check.json

      - name: Reproduce fixed offline RAG evaluation
        run: >-
          python scripts/run_eval.py
          --mode lexical
          --data data/samples/foods_sample.json
          --index-dir data/index
          --report /tmp/healthos-rag-eval.json

      - name: Upload evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-and-performance
          path: |
            /tmp/healthos-rag-eval.json
            /tmp/healthos-performance.json
            /tmp/healthos-release-check.json
          if-no-files-found: error

  detection-smoke:
    # 真实权重冒烟单独成 job：导出需要 ultralytics + torch（约 2GB），
    # 放进主 job 会让每次 docker build 都多等这笔下载。
    # 权重与导出结果按固定版本缓存，命中后这个 job 只跑几秒。
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve detection weights pin
        id: detection
        run: >-
          python scripts/prepare_food_detection_model.py
          --emit-pin >> "$GITHUB_OUTPUT"

      - name: Cache exported detection weights
        id: weights-cache
        uses: actions/cache@v4
        with:
          path: runtime/models
          key: yolo-${{ runner.os }}-${{ steps.detection.outputs.cache_key }}

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install export-only dependencies
        if: steps.weights-cache.outputs.cache-hit != 'true'
        run: >-
          python -m pip install --disable-pip-version-check
          ultralytics
          --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Download and export YOLOv8n weights
        if: steps.weights-cache.outputs.cache-hit != 'true'
        run: python scripts/prepare_food_detection_model.py

      - name: Real-weights detection smoke
        env:
          AGENT_PROVIDER_MODE: disabled
          RAG_MODE: lexical
          MEAL_DETECTION_MODE: onnx
        run: python -m pytest tests/integration -q
